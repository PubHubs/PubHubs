# Sygnal (Matrix push gateway) config, bundled into the hub image for LOCAL DEVELOPMENT ONLY -
# the same way config/local/livekit.local.yaml is (see Dockerfile). Unlike LiveKit's dev key,
# this file intentionally carries NO real push credentials: those are real Apple/Google secrets,
# not throwaway dev-only ones, so they must never be committed here.
#
# Disabled by default: boot/start_hub.py only starts Sygnal when /data/sygnal.yaml exists, which
# it doesn't unless you put one there. To actually test push notifications against a local hub:
#
#   1. Copy this file to pubhubs_hub/testhub<N>/sygnal.yaml (that directory is gitignored - see
#      pubhubs_hub/.gitignore's `/testhub[0-9]` entry - and is mounted at /data inside the
#      container, see start_testhub.py).
#   2. Uncomment and fill in the `apps` entry below for the platform you're testing, using a real
#      Apple/Google credential.
#   3. Drop the referenced key file (e.g. an Apple "Auth Key" .p8) next to it, also under
#      pubhubs_hub/testhub<N>/.
#   4. Restart the hub (`mask run hub server <N>`) and check its container logs for Sygnal's own
#      startup output.
#
# See also modules/pubhubs/_push_gateway_proxy.py, which routes `_matrix/push/v1/notify` from the
# hub's own public URL to this Sygnal instance, and global-client/src/logic/nativePush.ts's
# pushGatewayUrl(), which is why that exact path matters and why Sygnal must listen where the
# proxy expects it (below).

log:
    setup:
        version: 1
        formatters:
            normal:
                format: '%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s'
        handlers:
            stderr:
                class: logging.StreamHandler
                formatter: normal
        root:
            level: INFO
            handlers: [stderr]
        disable_existing_loggers: false

# Loopback-only and matching modules/pubhubs/_push_gateway_proxy.py's hardcoded target - Sygnal is
# never reached directly, only ever through that in-container proxy.
http:
    bind_addresses: ['127.0.0.1']
    port: 5000

apps:
    # iOS (APNs). This key ('nl.pubhubs.client.ios') is just Sygnal's lookup key for this pushkin
    # config - it's what global-client/src/logic/nativePush.ts's APP_ID_BY_TRANSPORT.apns sends as
    # the Matrix pusher's `app_id`, and is unrelated to `topic` below. `topic` DOES have to be the
    # app's real bundle id (ios/App/App.xcodeproj's PRODUCT_BUNDLE_IDENTIFIER, currently
    # 'nl.pubhubs.client') - that's what actually goes to APNs, and delivery silently fails if it's
    # wrong.
    #nl.pubhubs.client.ios:
    #    type: apns
    #    keyfile: /data/sygnal-apns-key.p8 # your Apple "Auth Key" (.p8), dropped next to this file
    #    key_id: REPLACE_ME # shown in the Apple Developer portal next to the key
    #    team_id: REPLACE_ME # your Apple Developer Team ID
    #    topic: nl.pubhubs.client
    #    platform: sandbox # matches App.entitlements' aps-environment: development (Xcode debug builds)
