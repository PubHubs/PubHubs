variables:
    # Tag of the rust-stable image from ilab/docker-build, as <rust version>-<pipeline iid>.
    RUST_IMAGE_TAG: 1.97.1-229
    RUST_IMAGE: registry.science.ru.nl/ilab/docker-build/rust-stable:${RUST_IMAGE_TAG}
    RUSTUP_AUTO_INSTALL: '0'
    # Node major for the client jobs; keep it equal to the `FROM node:<major>-slim` in
    # hub-client/Dockerfile.
    NODE_VERSION: '26'
    # The android-build image from ilab/docker-build, for the Android app, as
    # <compileSdk>-<pipeline iid>.
    ANDROID_IMAGE: registry.science.ru.nl/ilab/docker-build/android-build:36-232
    DOCKER_DRIVER: overlay2
    CARGO_INCREMENTAL: '0'
    CARGO_NET_RETRY: '3'
    CARGO_TERM_COLOR: always
    # The runner's default cache archiver is single-threaded gzip, and the rust `target/` caches
    # below are by far the largest thing it has to pack and unpack.  fastzip is parallel, and
    # `fastest` trades a somewhat bigger archive for a lot less CPU.
    FF_USE_FASTZIP: 'true'
    CACHE_COMPRESSION_LEVEL: fastest

before_script:
    - if [ -n "${CI_COMMIT_TAG}" ]; then ENVIRONMENT=stable; fi
    - if [ -z "${ENVIRONMENT}" ]; then ENVIRONMENT="${CI_COMMIT_REF_NAME}"; fi
    - echo "Environment=${ENVIRONMENT}"

# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
stages: # List of stages for jobs, and their order of execution
    - tests
    - publish-images
    - build-app
    - deploy-own

# Shared by every job that builds an image.
.docker-buildx:
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        - docker buildx create --name ci-builder --driver docker-container --use || docker buildx use ci-builder
        # The builder keeps its own local cache, separate from the host daemon's.
        - docker buildx prune --builder ci-builder --filter until=336h --force || true
        # image-manifest/oci-mediatypes make the cache manifest one the GitLab registry accepts.
        # zstd roughly halves what we push and pull compared with the default gzip, which matters
        # because compiled artifacts are the bulk of these caches.  force-compression makes buildx
        # recompress layers imported as gzip instead of re-exporting them as-is.
        - CACHE_ARGS="--cache-from type=registry,ref=${BUILD_CACHE_IMAGE}"
        - CACHE_ARGS="${CACHE_ARGS} --cache-to type=registry,ref=${BUILD_CACHE_IMAGE},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,force-compression=true"
        # buildx accepts several --cache-from sources and uses whichever has the layer, so a tag
        # build reads its own cache first and main's second.
        - if [ -n "${BUILD_CACHE_FALLBACK_IMAGE}" ]; then CACHE_ARGS="${CACHE_ARGS} --cache-from type=registry,ref=${BUILD_CACHE_FALLBACK_IMAGE}"; fi

        - CACHE_ARGS="${CACHE_ARGS} --provenance=false"

        # Every image gets its moving tag (:main or :stable).  A release tag additionally gets an
        # immutable per-version tag, so a hub can pin a version and roll back to an earlier one, plus
        # :latest as an alias for the most recent pinned version.
        - TAG_ARGS="-t ${CONTAINER_IMAGE}"
        - case "${CI_COMMIT_TAG}" in *-*) ;; v*.*.*) TAG_ARGS="${TAG_ARGS} -t ${CONTAINER_IMAGE%:*}:${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE%:*}:latest" ;; esac

# Shared by every job that needs the version we are building: the images bake it in, and the global
# client shows it in its about dialog.
.version:
    script:
        # Gitlab runners use a shallow clone of our repo,
        # which might not contain the latest tag, in which case `git describe --tags` fails.  In that case we fetch
        # a bit more history until we hit our tag's commit.
        # This used to work witout gc.auto=0 and maintenance.auto=false, but after a git update(?) this broke, causing the deepen loop to only run twice.
        - if [ -z "${CI_COMMIT_TAG}" ]; then until git describe --tags; do git -c gc.auto=0 -c maintenance.auto=false fetch --deepen 10; done; fi
        - export PH_VERSION="${CI_COMMIT_TAG:-$(git describe --tags)}"
        - echo "Version=${PH_VERSION}"

# Every merge request adds its change to CHANGELOG.md (see the merge request template).  This job is
# only in the pipeline of a merge request that leaves CHANGELOG.md alone, and fails there.  A merge
# request with nothing for the changelog gets the `no-changelog` label instead.
changelog-check:
    stage: tests
    tags:
        - docker
    interruptible: true
    image: alpine:3
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - CHANGELOG.md
          when: never
        - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)no-changelog(,|$)/
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    script:
        - echo "Add this merge request's change to the 'Changed not merged yet' part of CHANGELOG.md, with its prefix."
        - echo "Or, if it has nothing to add, give the merge request the no-changelog label and run a new pipeline (retrying this job is not enough)."
        - exit 1

# A release's notes on GitHub are its version's part of CHANGELOG.md, under a heading like
# "## 18 September 2026 - v3.5.5" (see .github/workflows/android-release.yml).  This fails when that
# part is missing or empty, already on the vX.Y.Z-rc0 tag, so it can be fixed before the release is
# tagged.  The deploys don't wait for it.
changelog-release-check:
    stage: tests
    tags:
        - docker
    image: alpine:3
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\d+)?$/
    script:
        - VERSION="${CI_COMMIT_TAG%%-*}"
        - awk -v v="- ${VERSION}" '/^## / { on = substr($0, length($0) - length(v) + 1) == v; next } on' CHANGELOG.md > notes.md
        - grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no entries under a heading ending in '- ${VERSION}'"; exit 1; }
        - cat notes.md

.rust-job:
    stage: tests
    tags:
        - docker
    interruptible: true
    image: $RUST_IMAGE
    variables:
        CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - pubhubs/**/*
              - cicd/.gitlab-ci.yml
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "stable"

rust-clippy:
    extends: .rust-job
    cache:
        key: rust-clippy-$RUST_IMAGE_TAG-$CI_COMMIT_REF_SLUG
        # New branches and MRs warm-start from main's cache instead of building cold.
        fallback_keys:
            - rust-clippy-$RUST_IMAGE_TAG-main
        paths:
            - pubhubs/target/
            - .cargo/
    script:
        - cd pubhubs
        - cargo clippy --all-targets -- --deny "warnings"

rust-test:
    extends: .rust-job
    cache: &rust-test-cache
        key: rust-test-$RUST_IMAGE_TAG-$CI_COMMIT_REF_SLUG
        fallback_keys:
            - rust-test-$RUST_IMAGE_TAG-main
        paths:
            - pubhubs/target/
            - .cargo/
    script:
        - cd pubhubs
        - RUST_BACKTRACE=full RUST_LOG=pubhubs=debug cargo test

# `cargo deny` only reads Cargo.lock and deny.toml -- it compiles nothing.  As its own job it runs
# next to the other rust jobs instead of after them, and it does not need the (multi-GB) target/ cache.
rust-deny:
    stage: tests
    tags:
        - docker
    interruptible: true
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - pubhubs/Cargo.lock
              - pubhubs/deny.toml
              - cicd/.gitlab-ci.yml
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "stable"
    image: $RUST_IMAGE
    variables:
        CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    cache:
        # Only the crates.io index and the advisory database, not the build artifacts.
        key: rust-deny-$RUST_IMAGE_TAG-$CI_COMMIT_REF_SLUG
        fallback_keys:
            - rust-deny-$RUST_IMAGE_TAG-main
        paths:
            - .cargo/
    script:
        - cd pubhubs
        - cargo deny check

rust-doc:
    stage: deploy-own
    tags:
        - docker
    rules:
        # Rebuilding the docs means running rustdoc over the whole dependency tree, which is the longest
        # job in the pipeline.  The output can only change when the Rust code (or this file) changes, so
        # skip it otherwise.  A pipeline started manually from the web UI always rebuilds them.
        - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "main"
          changes:
              - pubhubs/**/*
              - cicd/.gitlab-ci.yml
    needs:
        - rust-test
    image: $RUST_IMAGE
    variables:
        CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    cache:
        <<: *rust-test-cache
        policy: pull
    script:
        - cd pubhubs
        # target/doc comes back from the cache, so wipe it first: without that, dependency docs left
        # behind by an earlier (pre --no-deps) run would keep being deployed and cached forever.
        - rm -rf target/doc
        # --no-deps documents only pubhubs instead of every dependency crate as well.  We do not need
        # dependency documentation, and rendering it was the bulk of this job.
        - cargo run --quiet doc --document-private-items --no-deps
        - cd target/doc
        - chmod 600 $UPDATE_RUST_DOC_MAIN_KEY
        - tar c . | ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS ilab-update@ph.ihub.ru.nl -i $UPDATE_RUST_DOC_MAIN_KEY

build-pubhubs:
    stage: publish-images
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs:${CI_COMMIT_REF_NAME}
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs-buildcache:main
        - if: $CI_COMMIT_TAG
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs:stable
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs-buildcache:stable
              BUILD_CACHE_FALLBACK_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs-buildcache:main
    needs:
        - job: rust-clippy
          optional: true
        - job: rust-test
          optional: true
    tags:
        - docker
    image: docker:latest
    script:
        - !reference [.docker-buildx, script]
        - !reference [.version, script]
        - cd pubhubs
        # The cache keeps the compiled dependency tree (the `cargo chef cook` layer in
        # pubhubs/Dockerfile), so a commit that only touches our own sources does not recompile ~all
        # dependencies.  buildx pushes the image itself, so no separate `docker push`.
        - >
            docker buildx build --push ${TAG_ARGS}
            ${CACHE_ARGS}
            --build-arg PH_VERSION="${PH_VERSION}"
            -f Dockerfile .

deploy-main-phmss:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - build-pubhubs
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-phmss-main

deploy-stable-phmss:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_TAG
    needs:
        - build-pubhubs
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-phmss-stable

hub-unit-test: # This job runs in the test stage.
    stage: tests
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "stable"
    tags:
        - docker
    image: python:latest
    interruptible: true
    variables:
        PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/pip
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
    cache:
        key:
            files:
                - pubhubs_hub/requirements.txt
        paths:
            - .cache/pip
    before_script:
        - python --version # For debugging
    script:
        - cd pubhubs_hub
        # One pip run: a single dependency resolution, and the wheels come from the cache above.
        - pip install --upgrade unittest-xml-reporting -r requirements.txt
        - python -m xmlrunner discover -p '*_test.py' --output-file report.xml
    artifacts:
        reports:
            junit: pubhubs_hub/report.xml
        expire_in: 1 week

build-hub:
    stage: publish-images
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_hub:${CI_COMMIT_REF_NAME}
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_hub-buildcache:main
        - if: $CI_COMMIT_TAG
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_hub:stable
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_hub-buildcache:stable
              BUILD_CACHE_FALLBACK_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_hub-buildcache:main
    needs:
        - job: hub-unit-test
          optional: true
    tags:
        - docker
    image: docker:latest # docker:stable does not work, see https://gitlab.science.ru.nl/ilab/pubhubs_canonical/-/issues/228
    script:
        - !reference [.docker-buildx, script]
        - !reference [.version, script]
        - cd pubhubs_hub
        # The cache covers the two expensive parts of this image: the `yivi_build` stage (`git clone
        # irmago` + `go install ./yivi`) and the apt/pip layer.  HUB_VERSION is the last instruction
        # in the Dockerfile on purpose, so passing it here invalidates nothing above it.
        - >
            docker buildx build --push ${TAG_ARGS}
            ${CACHE_ARGS}
            --build-arg HUB_VERSION="${PH_VERSION}"
            .

deploy-main-hub:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - build-hub
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - cd pubhubs_hub
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-testhub-matrix-main

deploy-stable-hubs:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_TAG
    needs:
        - build-hub
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - cd pubhubs_hub
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-testhub-matrix-stable
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-tryouthub-matrix
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-open-source-dev-matrix

.node-setup:
    image: node:${NODE_VERSION}
    tags: [docker]
    interruptible: true
    variables:
        npm_config_cache: ${CI_PROJECT_DIR}/.npm
    cache: &node-cache
        key:
            files:
                - package-lock.json
        paths:
            - .npm/
        # Filled by client-format-check; the other jobs only read it, so one pipeline uploads the
        # archive once instead of six times.
        policy: pull
    before_script:
        - npm ci --prefer-offline --no-audit --no-fund
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "stable"
        - if: $CI_COMMIT_TAG

client-format-check:
    extends: .node-setup
    stage: tests
    cache:
        <<: *node-cache
        policy: pull-push
    script:
        - npm run check:format

# The npm counterpart of `rust-deny`: `npm audit` asks the registry which advisories apply to
# package-lock.json, and scripts/npm-audit.mjs fails on the ones that
# scripts/npm-audit.config.mjs does not accept.
npm-audit:
    stage: tests
    tags:
        - docker
    interruptible: true
    image: node:${NODE_VERSION}
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "stable"
    # registry.npmjs.org answering 503 for the advisory endpoint has nothing to do with the branch
    # being tested, and no change here can fix it.  The check retries and then exits 75, which lands
    # the job in "warning" instead of turning an unrelated pipeline red.
    allow_failure:
        exit_codes:
            - 75
    script:
        - npm run check:audit

client-lint:
    extends: .node-setup
    stage: tests
    script:
        - npm run check:lint

client-type-check:
    extends: .node-setup
    stage: tests
    script:
        - npm run check:types

globalclient-build:
    extends: .node-setup
    stage: tests
    script:
        # vite.config.ts picks PH_VERSION up from the environment.
        - !reference [.version, script]
        - npm run build --workspace=global-client
    artifacts:
        paths:
            - global-client/dist/
        expire_in: 1 hour

globalclient-unit-test:
    extends: .node-setup
    stage: tests
    script:
        - npm run test:run --workspace=global-client

hubclient-unit-test:
    extends: .node-setup
    stage: tests
    script:
        - npm run test:run --workspace=hub-client

build-hubclient:
    stage: publish-images
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_client:${CI_COMMIT_REF_NAME}
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_client-buildcache:main
        - if: $CI_COMMIT_TAG
          variables:
              CONTAINER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_client:stable
              BUILD_CACHE_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_client-buildcache:stable
              BUILD_CACHE_FALLBACK_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}/pubhubs_client-buildcache:main
    needs:
        - job: client-format-check
          optional: true
        - job: client-lint
          optional: true
        - job: client-type-check
          optional: true
        - job: hubclient-unit-test
          optional: true
    tags:
        - docker
    image: docker:latest
    script:
        - !reference [.docker-buildx, script]
        - !reference [.version, script]
        # The image build context has no .git, so PH_VERSION is the only way the client learns which
        # version it is; it ends up in the about dialog, in /usr/var/static/version.txt and in the
        # image's org.opencontainers.image.version label.
        - >
            docker buildx build --push ${TAG_ARGS}
            ${CACHE_ARGS}
            --build-arg PH_VERSION="${PH_VERSION}"
            -f hub-client/Dockerfile .

deploy-main-hubclient:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs: &deployhubclientneeds
        - build-hubclient
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - cd hub-client
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-testhub-client-main

deploy-stable-hubclients:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_TAG
    needs: *deployhubclientneeds
    tags: [docker]
    image: registry.science.ru.nl/ilab/docker-build/ubuntu-iso:main
    script:
        - cd hub-client
        - chmod 600 $ILAB_VM_TRIGGER_UPDATE_KEY
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-testhub-client-stable
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-tryouthub-client
        - ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS $ILAB_VM_TRIGGER_UPDATE_USER@ph.ihub.ru.nl -i $ILAB_VM_TRIGGER_UPDATE_KEY docker-open-source-dev-client

deploy-main-globalclient:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - globalclient-build
        - client-format-check
        - client-lint
        - client-type-check
        - globalclient-unit-test
    tags: [docker]
    image: node:${NODE_VERSION}
    script:
        - cd global-client/dist
        - chmod 600 $UPDATE_GLOBAL_CLIENT_MAIN_KEY
        - tar c . | ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS ilab-update@ph.ihub.ru.nl -i $UPDATE_GLOBAL_CLIENT_MAIN_KEY

deploy-stable-globalclient:
    stage: deploy-own
    rules:
        - if: $CI_COMMIT_TAG
    needs:
        - job: globalclient-build
          optional: true
        - job: client-format-check
          optional: true
        - job: client-lint
          optional: true
        - job: client-type-check
          optional: true
        - job: globalclient-unit-test
          optional: true
    tags: [docker]
    image: node:${NODE_VERSION}
    script:
        - cd global-client/dist
        - chmod 600 $UPDATE_GLOBAL_CLIENT_STABLE_KEY
        - tar c . | ssh -o UserKnownHostsFile=$ILAB_VM_TRIGGER_UPDATE_KNOWN_HOSTS ilab-update@ph.ihub.ru.nl -i $UPDATE_GLOBAL_CLIENT_STABLE_KEY

# Builds the Android app, unsigned, in merge requests and on main when something the app build depends
# on changed, so a broken app build shows up before a release tag does. build-android below does the
# signed build on release tags.
android-build-check:
    stage: tests
    tags:
        - docker
    interruptible: true
    image: $ANDROID_IMAGE
    variables:
        GRADLE_USER_HOME: ${CI_PROJECT_DIR}/.gradle-home
        npm_config_cache: ${CI_PROJECT_DIR}/.npm
    cache:
        key: android-build
        paths:
            - .gradle-home/caches
            - .gradle-home/wrapper
            - .npm
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes: &android-build-inputs
              - android/**/*
              - capacitor.config.ts
              - package.json
              - package-lock.json
              - global-client/config/**/*
              - cicd/.gitlab-ci.yml
        - if: $CI_COMMIT_BRANCH == "main"
          changes: *android-build-inputs
    script:
        - npm ci --prefer-offline --no-audit --no-fund
        - npm run cap:sync:android:release
        - cd android
        # PUBHUBS_KEYSTORE is unset, so this builds unsigned (see android/app/build.gradle).
        - ./gradlew --no-daemon assembleRelease

# Builds the Android app on a release tag: the app bundle for the Play Store and an APK, both signed
# with the upload key. See "Release builds" in docs/app/README.md. Uploading to Play is still by hand.
build-android:
    stage: build-app
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    tags:
        - docker
    image: $ANDROID_IMAGE
    variables:
        GRADLE_USER_HOME: ${CI_PROJECT_DIR}/.gradle-home
        npm_config_cache: ${CI_PROJECT_DIR}/.npm
    cache:
        key: android-build
        paths:
            - .gradle-home/caches
            - .gradle-home/wrapper
            - .npm
    script:
        - !reference [.version, script]
        # The version in build.gradle has to be set for this release (see the merge-to-stable template);
        # Play only takes each version code once.
        - VERSION_NAME="${CI_COMMIT_TAG#v}"
        - VERSION_CODE=$(echo "${VERSION_NAME}" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
        - >
            grep -qF "versionName \"${VERSION_NAME}\"" android/app/build.gradle && grep -qE "^ *versionCode ${VERSION_CODE}$" android/app/build.gradle
            || { echo "android/app/build.gradle needs versionName \"${VERSION_NAME}\" and versionCode ${VERSION_CODE}"; exit 1; }
        # The signing variables are protected, so they are only there on protected tags.
        - test -n "${PUBHUBS_KEYSTORE_BASE64}" || { echo "PUBHUBS_KEYSTORE_BASE64 is not set; is the tag protected?"; exit 1; }
        - export PUBHUBS_KEYSTORE="$(mktemp)"
        - echo "${PUBHUBS_KEYSTORE_BASE64}" | base64 -d > "${PUBHUBS_KEYSTORE}"
        - npm ci
        - npm run cap:sync:android:release
        - cd android
        - ./gradlew --no-daemon bundleRelease assembleRelease
        - rm "${PUBHUBS_KEYSTORE}"
    artifacts:
        name: pubhubs-android-${CI_COMMIT_TAG}
        paths:
            - android/app/build/outputs/bundle/release/app-release.aab
            - android/app/build/outputs/apk/release/app-release.apk
        expire_in: never
