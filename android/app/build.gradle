apply plugin: 'com.android.application'

android {
    namespace = "nl.pubhubs.client"
    compileSdk = rootProject.ext.compileSdkVersion
    // Needed to generate BuildConfig.DEBUG, used by MainActivity.java to gate the dev-only
    // mixed-content-allow setting to debug builds. AGP 8+ no longer generates BuildConfig by default.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "net.pubhubs.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Set on every release, see "Release builds" in docs/app/README.md. F-Droid reads these literals.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release builds are signed only when these variables are set, as in CI. F-Droid builds without them
    // and signs with its own key.
    def releaseKeystore = System.getenv('PUBHUBS_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('PUBHUBS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PUBHUBS_KEY_ALIAS')
                keyPassword System.getenv('PUBHUBS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Two builds that differ only in how push notifications arrive (see src/{gplay,fdroid}/java/.../push/):
    // gplay (Play Store) through Firebase Cloud Messaging, fdroid through UnifiedPush. F-Droid
    // doesn't accept Google's libraries in any form, so nothing Firebase may reach the fdroid build.
    flavorDimensions "distribution"
    productFlavors {
        gplay {
            dimension "distribution"
        }
        fdroid {
            dimension "distribution"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    gplayImplementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    gplayImplementation "com.google.firebase:firebase-messaging"
    fdroidImplementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
}

apply from: 'capacitor.build.gradle'

// The Firebase project of the gplay build (gitignored; CI writes it from GOOGLE_SERVICES_JSON_BASE64).
// The plugin would also want one for fdroid, so its task is switched off there.
if (file('src/gplay/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    tasks.configureEach { task ->
        if (task.name.startsWith('process') && task.name.endsWith('GoogleServices') && !task.name.contains('Gplay')) {
            task.enabled = false
        }
    }
} else {
    logger.info("src/gplay/google-services.json not found: push notifications won't work in the gplay build")
}
