apply plugin: 'com.android.application'

android {
    namespace = "nl.pubhubs.client"
    compileSdk = rootProject.ext.compileSdkVersion
    // Needed to generate BuildConfig.DEBUG, used by MainActivity.java to gate the dev-only
    // mixed-content-allow setting to debug builds. AGP 8+ no longer generates BuildConfig by default.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "nl.pubhubs.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Two push-notification transports, so PubHubs can ship both a Play Store build and an
    // F-Droid build: F-Droid's build servers cannot fetch Google's proprietary Maven artifacts
    // at all, so any Firebase/Play-Services dependency must be completely absent from that
    // variant, not merely unused at runtime. Each flavor gets its own
    // nl.pubhubs.client.push.NativePushPlugin implementation via source-set overrides (see
    // src/gplay/java/.../push/ and src/fdroid/java/.../push/) - shared code (MainActivity,
    // PushEvents, LocalNotifier) never references Firebase or UnifiedPush symbols directly, so it
    // compiles identically for both. See the push notifications plan for the full rationale.
    flavorDimensions "distribution"
    productFlavors {
        // Play Store / general APK build: FCM via Firebase Cloud Messaging.
        gplay {
            dimension "distribution"
        }
        // F-Droid build: no Google dependency at all. Uses UnifiedPush instead, which requires
        // the end user to have a UnifiedPush distributor (e.g. ntfy) installed.
        fdroid {
            dimension "distribution"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // gplay flavor only: Firebase Cloud Messaging, for src/gplay/.../push/NativePushPlugin.java
    // and FcmService.java. The BoM pins compatible versions of all Firebase artifacts; only
    // firebase-messaging itself is actually used.
    gplayImplementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    gplayImplementation "com.google.firebase:firebase-messaging"

    // fdroid flavor only: UnifiedPush, for src/fdroid/.../push/NativePushPlugin.java and
    // UnifiedPushService.java. Google-free, self-hostable push - see the push notifications plan.
    fdroidImplementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
}

apply from: 'capacitor.build.gradle'

// Applied only when the gplay flavor's google-services.json is actually present (gitignored;
// each build/developer/CI job supplies their own - see cicd/.gitlab-ci.yml's
// android-assemble-gplay job). Confirmed by actually building both flavors locally (no
// google-services.json anywhere in this sandbox originally, so this needed live verification,
// not just reasoning about it):
//   - Applying the plugin at all - regardless of this file-existence guard - registers a
//     process<Variant>GoogleServices task for *every* variant, gplay and fdroid alike. That task
//     hard-fails fdroid's build ("File google-services.json is missing") the moment the gplay
//     file exists anywhere in the module, even though fdroid never asked for one. This *did*
//     reproduce locally, so the fix below is verified, not guessed.
//   - The fix: explicitly disable the google-services task for every non-gplay variant, so the
//     plugin only ever does real work for gplay. This is deliberately name-matching rather than
//     using AGP's variant-filtering API, to keep this readable without extra imports.
if (file('src/gplay/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'

    tasks.configureEach { task ->
        if (task.name.startsWith('process') && task.name.endsWith('GoogleServices') && !task.name.contains('Gplay')) {
            task.enabled = false
        }
    }
} else {
    logger.info("src/gplay/google-services.json not found - gplay push notifications won't work, fdroid is unaffected")
}
